name: Lake Tahoe Currents daily update

# Refreshes the rolling model archive and publishes the Currents page to GitHub Pages.
# Nothing is committed: the previous archive is read from the live site, merged with the
# latest TERC hours and airport winds, and the Currents folder is redeployed under
# https://trpa-agency.github.io/Monitoring/Currents/. Pages source: GitHub Actions.
# The site root only redirects to Currents/ for now.
#
# The same deployment also stages ltinfo/ (the LT Info Monitoring prototypes) under
# https://trpa-agency.github.io/Monitoring/ltinfo/. A Pages deployment replaces the whole
# site, so one workflow has to stage everything; a push that touches ltinfo/ runs the full
# job, including the archive refresh, which is harmless because the refresh merges from the
# live site.

on:
  schedule:
    - cron: "30 14 * * *"   # 14:30 UTC, 7:30 a.m. Pacific daylight time
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ltinfo/**"
      - "Currents/index.html"
      - "Currents/assets/**"
      - ".github/workflows/currents-daily.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: currents-pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}Currents/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install numpy requests pyyaml

      - name: Stage the page
        run: |
          mkdir -p site/Currents
          cp Currents/index.html site/Currents/
          cp -r Currents/assets site/Currents/assets
          cat > site/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en"><head><meta charset="UTF-8" /><title>TRPA Monitoring</title>
          <meta http-equiv="refresh" content="0; url=Currents/" />
          <link rel="canonical" href="https://trpa-agency.github.io/Monitoring/Currents/" /></head>
          <body><p>Redirecting to <a href="Currents/">Lake Tahoe Currents</a>.</p></body></html>
          EOF

      - name: Stage the LT Info prototypes
        run: |
          mkdir -p site/ltinfo
          cp -r ltinfo/kit ltinfo/templates ltinfo/pages site/ltinfo/
          cp ltinfo/CONTRACT.md ltinfo/PLAN.md site/ltinfo/

      - name: Update the archive
        working-directory: Currents
        run: |
          python scripts/update_currents.py \
            --prev https://trpa-agency.github.io/Monitoring/Currents/data \
            --out ../site/Currents/data
          cp data/bathy.json ../site/Currents/data/

      - name: Keep the run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: update-log
          path: Currents/logs/*.log
          retention-days: 30

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
