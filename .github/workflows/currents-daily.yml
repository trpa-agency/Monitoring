name: Lake Tahoe Currents daily update

# Refreshes the rolling model archive behind Currents/index.html.
# The page is served by GitHub Pages from the main branch. The archive is NOT committed to main:
# each run reads the previous archive from the currents-data branch, merges the latest TERC hours
# and airport winds, and force-pushes the result as a single commit on that branch (no history, no
# bloat). The page fetches it from raw.githubusercontent.com and falls back to the committed seed.

on:
  schedule:
    - cron: "30 14 * * *"   # 14:30 UTC, 7:30 a.m. Pacific daylight time
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: currents-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install numpy requests pyyaml

      - name: Update the archive
        working-directory: Currents
        run: |
          python scripts/update_currents.py \
            --prev https://raw.githubusercontent.com/${{ github.repository }}/currents-data \
            --out ../build/data

      - name: Keep the run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: update-log
          path: Currents/logs/*.log
          retention-days: 30

      - name: Publish the archive to the currents-data branch
        working-directory: build/data
        run: |
          git init -q
          git checkout -q -b currents-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add meta.json currents.bin
          git commit -q -m "Archive update $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" currents-data
